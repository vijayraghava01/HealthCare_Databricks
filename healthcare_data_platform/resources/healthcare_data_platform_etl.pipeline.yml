# The main pipeline for healthcare_data_platform

resources:
  pipelines:
    healthcare_data_platform_etl:
      name: healthcare_data_platform_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      root_path: "../src/healthcare_data_platform_etl"
      serverless: true
      libraries:
        - glob:
            include: ../src/healthcare_data_platform_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - "../dist/*.whl"
