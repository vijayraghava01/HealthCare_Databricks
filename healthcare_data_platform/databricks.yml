# This is a Declarative Automation Bundle definition for healthcare_data_platform.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: healthcare_data_platform
  uuid: 74b99ef7-bcc4-4ceb-9206-66add8df4832

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-59695fa1-ba1a.cloud.databricks.com
    variables:
      catalog: workspace
      schema: dev
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://dbc-59695fa1-ba1a.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/rydiodemo01@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/rydiodemo01@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: rydiodemo01@gmail.com
        level: CAN_MANAGE
